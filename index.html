<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Dainosuke Sasaki">
    <title>〇✕ゲーム (三目並べ)</title>
    <link rel="stylesheet" href="FINAL.css">
    <script src="FINAL.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>〇✕ゲーム (三目並べ)</h1>
            <p class="subtitle">2人で交代でマス目を押して勝負しよう！</p>
        </header>

        <main>
            <section class="game-area">
                <div id="status" class="status">〇 の番です</div>
                <div class="board" id="board">
                    <button class="cell" data-index="0"></button>
                    <button class="cell" data-index="1"></button>
                    <button class="cell" data-index="2"></button>
                    <button class="cell" data-index="3"></button>
                    <button class="cell" data-index="4"></button>
                    <button class="cell" data-index="5"></button>
                    <button class="cell" data-index="6"></button>
                    <button class="cell" data-index="7"></button>
                    <button class="cell" data-index="8"></button>
                </div>
                <button id="reset-btn" class="reset-btn">ゲームをリセット</button>
            </section>
        </main>

        <footer>
            <p>大学生のための情報・デジタルリテラシー Web演習</p>
            <p>Copyright &copy; Dainosuke Sasaki, All Rights.</p>
        </footer>
    </div>
</body>
</html>
